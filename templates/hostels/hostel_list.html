{% extends 'base.html' %}
{% block title %}Hostels{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h1 class="h4 mb-0">Hostels</h1>
  <a class="btn btn-primary" href="{% url 'hostels:create' %}">Add hostel</a>
</div>
<table class="table table-striped bg-white">
  <thead><tr><th>Code</th><th>Name</th><th>Total capacity</th><th></th></tr></thead>
  <tbody>
  {% for hostel in hostels %}
    <tr>
      <td>{{ hostel.code }}</td>
      <td>{{ hostel.name }}</td>
      <td>{{ hostel.total_capacity }}</td>
      <td><a href="{% url 'hostels:detail' hostel.pk %}">View</a></td>
    </tr>
  {% empty %}
    <tr><td colspan="4">No hostels yet.</td></tr>
  {% endfor %}
  </tbody>
</table>
{% endblock %}
