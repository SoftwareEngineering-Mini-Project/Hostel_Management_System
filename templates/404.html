{% extends 'base.html' %}
{% block title %}Page not found{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body">
    <p class="text-muted mb-1">Error 404</p>
    <h1 class="h3 mb-3">Page not found</h1>
    <p class="mb-4">The page you asked for does not exist, or the record it points to has been removed.</p>
    <a class="btn btn-primary" href="{% url 'home' %}">Go to home page</a>
  </div>
</div>
{% endblock %}
