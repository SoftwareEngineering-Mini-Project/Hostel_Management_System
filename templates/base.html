<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Hostel Management System{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
  <div class="container">
    <a class="navbar-brand" href="{% url 'home' %}">Hostel Management</a>
    {% if user.is_authenticated %}
    <div class="navbar-nav me-auto">
      {% if user.is_staff %}
        <span class="navbar-text text-uppercase small me-3">Administrator</span>
        <a class="nav-link" href="{% url 'dashboard:summary' %}">Dashboard</a>
        <a class="nav-link" href="{% url 'hostels:list' %}">Hostels</a>
        <a class="nav-link" href="{% url 'rooms:list' %}">Rooms</a>
      {% else %}
        <span class="navbar-text text-uppercase small me-3">Student</span>
        <a class="nav-link" href="{% url 'rooms:list' %}">Room availability</a>
      {% endif %}
    </div>
    <form method="post" action="{% url 'logout' %}" class="d-flex">
      {% csrf_token %}
      <button class="btn btn-outline-light btn-sm" type="submit">Log out</button>
    </form>
    {% else %}
    <a class="btn btn-outline-light btn-sm" href="{% url 'login' %}">Log in</a>
    {% endif %}
  </div>
</nav>
<main class="container">
  {% for message in messages %}
    <div class="alert alert-{% if message.tags == 'error' %}danger{% else %}{{ message.tags|default:'info' }}{% endif %}">{{ message }}</div>
  {% endfor %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
